<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

        class Person{
            //实例属性
            constructor(name,age){
                this.name=name;
                this.age=age;
            }
            //实例方法
            say(){
                console.log("hello");
            }


            //静态指的是Person，实例指的是p

            //静态方法
            static sayhello(){
                //this指向当前类，而不是实例对象
                console.log(this.age);//undefined  在静态方法中this.age其实是Person.age
            }
        }
        //p:实例对象
        var p=new Person("gfaihg",20);
        p.say();
        console.log(p.name);

        Person.sayhello();//

        //静态属性
        Person.age=20;


        class People{
            static getsay(){
                this.say();
            }

            static say(){
                console.log("hello");
            }

            say(){
                console.log("world");
            }
        }
        People.getsay()//输出结果是hello


    </script>
</body>
</html>
