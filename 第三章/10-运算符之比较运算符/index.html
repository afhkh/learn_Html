<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var num3=10;
        var num4='10';

        console.log(num3 ==num4);
        // === 严格比较：数值本身是否相同。类型本身是否相同
        console.log(num3===num4);

        console.log(num3!=num4)//false
        // !== 严格比较：数值本身是否相同。类型本身是否相同
        console.log(num3 !== num4);//true
    </script>
</body>
</html>
