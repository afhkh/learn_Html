<body>
    <script>

        /*
            常量（const）：声明之后不得改变的
                1.const不允许重新赋值
                2.必须声明的时候直接初始化
                3.const作用域和let一样，块级作用域
                4.const命名的常量也不提升
                5.const不可重复声明
        */
        // const PI=3.14;
        // console.log(PI);
        // const PI=3.15;
        //报错，声明的常量不可改变

        const name="fakgh";//必须声明的时候直接初始化

    </script>
</body>
</html>
