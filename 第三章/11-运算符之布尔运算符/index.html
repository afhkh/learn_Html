<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // ! 为取反
        var flag =false;
        console.log(!flag);//true

        //以下几个结果均为True
        console.log(!null);
        console.log(!undefined);
        console.log(!0);
        console.log(!"");
        console.log(!NaN);
        console.log(!false);

        // && 代表并 and
        //  ||  代表 或 or
        console.log(10<20 && 10>5); // true

        console.log(10<20 || 10<5);//true




    </script>
</body>
</html>
