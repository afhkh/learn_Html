<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            width: 700px;
            height: 700px;
            background-color: blanchedalmond;
        }

        div{
            width: 300px;
            height: 300px;
            float: left;
        }
        .box1{
            background-color: red;
        }
        .box2{
            background-color: rgb(72, 0, 255);
        }
        .box3{
            background-color: rgb(0, 255, 81);
        }
        ul li{
            float: left;
            margin: 0 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="box1"></div>
        <div class="box2"></div>
        <div class="box3"></div>
    </div>

    <ul>
        <li>导航1</li>
        <li>导航2</li>
        <li>导航3</li>
        <li>导航4</li>
    </ul>
</body>
</html>
